name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: dependency audit
        run: bun audit
      - name: typecheck
        run: bun run typecheck
      - name: lint
        run: bun run lint
      - name: test
        run: bun test

  images:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        service: [mcp, indexer, dashboard]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: build ${{ matrix.service }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  backup-image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: shellcheck the backup scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck docker/backup/*.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: docker/backup
          push: false
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: the compose file must be valid with only the required secrets set
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' .env
          sed -i 's/^WIKI_API_TOKEN=.*/WIKI_API_TOKEN=ci/' .env
          sed -i 's/^MCP_TOKEN=.*/MCP_TOKEN=ci/' .env
          sed -i 's/^DASHBOARD_TOKEN=.*/DASHBOARD_TOKEN=ci/' .env
          sed -i 's|^MCP_PUBLIC_URL=.*|MCP_PUBLIC_URL=https://athena-mcp.example.com|' .env
          docker compose config --quiet
          echo "no container may publish a port"
          test "$(docker compose config | grep -c published)" -eq 0
